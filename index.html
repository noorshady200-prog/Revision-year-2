<style>

:root[data-theme="dark"]{color-scheme:dark;--bg:#2a1d55;--bg2:#12304d;--card:#34296a;--tx:#fff4d6;--mut:#cfc6f5;--chip:#463b82;--line:#5a4c9c}
body{margin:0;min-height:100%;font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;background-color:var(--bg);color:var(--tx);line-height:1.7}
.wrap{max-width:780px;margin:auto;padding:14px}

.tr{display:block;color:var(--mut);font-size:.9rem}

.in{font-size:1.35rem;width:min(100%,420px);border:3px solid var(--c);border-radius:14px;padding:2px 10px;background:var(--chip);color:var(--tx);margin-top:6px}
.sp{border:0;background:#ffd23f;border-radius:50%;width:38px;height:38px;font-size:1.1rem;cursor:pointer;flex:none}

.fb.show{display:block}.fb.ok{background:#d6f5e3;color:#0b5d33}.fb.no{background:#ffe0e0;color:#8a1c1c}
.fb small{direction:ltr;display:inline-block}
.ft{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:var(--chip)}
.bt{font:inherit;font-weight:800;border:0;border-radius:18px;padding:4px 18px;background:var(--c);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}.bt.g{background:#8b90ad}
.sc{font-weight:800;font-size:1.2rem}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.dc{font:inherit;background:var(--chip);color:var(--tx);border:3px solid var(--c);border-radius:18px;padding:6px 10px;text-align:center;cursor:pointer;display:block}

.de{display:block;font-size:2.4rem;line-height:1.3}

.cf{position:fixed;top:-40px;z-index:99;pointer-events:none;animation:fall 2.6s linear forwards}

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),B='▢';
const SH={i:l=>l+'ـ',m:l=>'ـ'+l+'ـ',f:l=>'ـ'+l,s:l=>l};

...L('الدَّالُ ( د ) · Daal','د','fs',[['مَ','رَسَةٌ','f','مَدْرَسَةٌ','school'],['يَ','','f','يَدٌ','hand'],['','يكٌ','s','دِيكٌ','rooster']]),
...L('الثَّاءُ ( ث ) · Thaa','ث','imfs',[['كُمَّ','رَى','m','كُمَّثْرَى','pear'],['مُثَلَّ','','f','مُثَلَّثٌ','triangle'],['','عْلَبٌ','i','ثَعْلَبٌ','fox']]),
...L('التَّاءُ ( ت ) · Taa','ت','imfs',[['تُو','','s','تُوتٌ','berries'],['كِ','ابٌ','m','كِتَابٌ','book'],['','مْرٌ','i','تَمْرٌ','dates']]),
...L('الرَّاءُ ( ر ) · Raa','ر','fs',[['فَ','اشَةٌ','f','فَرَاشَةٌ','butterfly'],['','مْلٌ','s','رَمْلٌ','sand'],['قِطَا','','f','قِطَارٌ','train']]),
...L('الخَاءُ ( خ ) · Khaa','خ','imfs',[['بِطِّي','','f','بِطِّيخٌ','watermelon'],['نَ','لَةٌ','m','نَخْلَةٌ','palm tree'],['','رُوفٌ','i','خَرُوفٌ','sheep']]),
...L('الجِيمُ ( ج ) · Jeem','ج','imfs',[['ثَلْ','','f','ثَلْجٌ','snow'],['نَ','مٌ','m','نَجْمٌ','star'],['','دِّي','i','جَدِّي','my grandfather']])]},
{c:'#ff9f1c',ic:'🖼️',ar:'صِلِ الصُّورَةَ بِالكَلِمَةِ الَّتِي تَحْتَوِي عَلَى الحَرْفِ المَذْكُورِ.',en:'Match each picture with the word that contains the given letter.',it:[

...M('حَرْفُ البَاءِ ( ب ) · Baa',[['🚪','بَابٌ','door'],['🐄','بَقَرَةٌ','cow'],['🦆','بَطَّةٌ','duck'],['👧','بِنْتٌ','girl']]),

it:[['👨','أَبِي','هَذَا','This is my father.'],['👩','أُمِّي','هَذِهِ','This is my mother.'],['👦','أَخِي','هَذَا','This is my brother.'],['👧','أُخْتِي','هَذِهِ','This is my sister.'],['👴','جَدِّي','هَذَا','This is my grandfather.'],['👵','جَدَّتِي','هَذِهِ','This is my grandmother.'],['🧒','وَلَدٌ','هَذَا','This is a boy.'],['🦁','أَسَدٌ','هَذَا','This is a lion.'],['👧','بِنْتٌ','هَذِهِ','This is a girl.'],['🐝','نَحْلَةٌ','هَذِهِ','This is a bee.']].map(([e,w,a,en])=>({em:e,q:B+' '+w,opts:['هَذَا','هَذِهِ'],ans:a,full:a+' '+w,en,pre:[w,''],sayo:1}))},
{c:'#8a5cf6',ic:'🗂️',ar:'صَنِّفِ الكَلِمَاتِ الآتِيَةَ حَسَبَ الحَرْفِ الأَوَّلِ.',en:'Classify the following words by their first letter.',
it:[['🐋','حُوتٌ','ح','whale'],['🐰','أَرْنَبٌ','أ','rabbit'],['🍎','تُفَّاحٌ','ت','apple'],['🐄','بَقَرَةٌ','ب','cow'],['🐪','جَمَلٌ','ج','camel'],['🐑','خَرُوفٌ','خ','sheep']].map(([e,w,l,en])=>({em:e,q:w+' ← '+B,opts:['أ','ب','ت','ج','ح','خ'],ans:l,full:w+' ← '+l,en,pre:[w,en]}))},
{c:'#ef5da8',ic:'🧩',ar:'حَلِّلِ الكَلِمَاتِ إِلَى حُرُوفِهَا (اُكْتُبِ الحُرُوفَ وَبَيْنَهَا /).',en:'Break each word into its letters (write the letters separated by /).',
it:[['أَبٌ','أ / ب','father'],['أُمٌّ','أ / م','mother'],['بَابٌ','ب / ا / ب','door'],['قَلَمٌ','ق / ل / م','pen'],['وَلَدٌ','و / ل / د','boy'],['بَطَّةٌ','ب / ط / ة','duck'],['لَعِبَ','ل / ع / ب','played'],['كَتَبَ','ك / ت / ب','wrote'],['سَمَكَةٌ','س / م / ك / ة','fish'],['مَدْرَسَةٌ','م / د / ر / س / ة','school']].map(([w,a,en])=>({q:w,inp:1,ph:'ب / ا / ب',ans:a,full:w+' = '+a,en,pre:[w,en]}))},
{c:'#3a86ff',ic:'💬',ar:'عَبِّرْ عَنِ الصُّوَرِ بِجُمْلَةٍ بَسِيطَةٍ مُسْتَخْدِمًا الكَلِمَاتِ المُسَاعِدَةَ.',en:'Express the pictures in a simple sentence using the helping words.',it:[
...[['👨','هَذَا أَبِي.','This is my father.'],['👩','هَذِهِ أُمِّي.','This is my mother.'],['🧒','هَذَا أَخِي.','This is my brother.'],['👧','هَذِهِ أُخْتِي.','This is my sister.']].map(([e,a,en],k)=>({h:k?'':'( هَذَا – هَذِهِ – أَبِي – أُمِّي – أَخِي – أُخْتِي )<br><span class="en">(This – This – my father – my mother – my brother – my sister)</span>',em:e,q:'',inp:1,open:1,ans:a,full:a,en})),
...[['❤️👩','أَنَا أُحِبُّ أُمِّي.','I love my mother.'],['❤️👴','أَنَا أُحِبُّ جَدِّي.','I love my grandfather.'],['👀🐰','أَنَا أَرَى الأَرْنَبَ.','I see the rabbit.'],['👀🐑','أَنَا أَرَى الخَرُوفَ.','I see the sheep.'],['👀🐶','أَنَا أَرَى الكَلْبَ.','I see the dog.'],['❤️👨','أَنَا أُحِبُّ أَبِي.','I love my father.']].map(([e,a,en],k)=>({h:k?'':'( أَنَا أُحِبُّ – أَنَا أَرَى – أَخِي – أُخْتِي – أُمِّي – أَبِي – جَدِّي – الأَرْنَبُ – الخَرُوفُ – الكَلْبُ )<br><span class="en">(I like – I see – my brother – my sister – my mother – my father – my grandfather – the rabbit – the sheep – the dog)</span>',em:e,q:'',inp:1,open:1,ans:a,full:a,en}))]},
